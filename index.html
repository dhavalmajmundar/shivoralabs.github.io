<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivora Labs</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Icons/shivora_favicon.jpg">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #090A0F;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        /* NAVBAR */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #090A0F;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav img {
            height: 55px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li {
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            cursor: pointer;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 120px 20px;
        }

        .hero img {
            height: 180px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-family: 'Sora', sans-serif;
            font-size: 48px;
            letter-spacing: 0.1em;
            margin: 0;
        }

        .hero p {
            font-size: 20px;
            margin-top: 15px;
            color: #E2E4F0;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <img src="Icons/shivora_landscape_logo.jpg" alt="Shivora Labs Logo">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Projects</li>
            <li>Contact</li>
        </ul>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <img src="Icons/shivora_primary_logo.jpg" alt="Shivora Labs Primary Logo">
        <h1>SHIVORA LABS</h1>
        <p>Cosmic Intelligence. Futuristic Engineering.</p>
    </section>

</body>
</html>
